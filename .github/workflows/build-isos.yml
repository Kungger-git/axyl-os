name: Build ISOs

on:
  push:
    branches: [master]
    tags: ['v*']
    paths:
      - 'archiso/**'
      - 'artixiso/**'
      - 'skel/**'
      - 'docker/**'
      - 'build.sh'
      - 'tools/reassemble-iso.sh'
      - '.github/workflows/build-isos.yml'
  pull_request:
    paths:
      - 'archiso/**'
      - 'artixiso/**'
      - 'skel/**'
      - 'docker/**'
      - 'build.sh'
      - 'tools/reassemble-iso.sh'
      - '.github/workflows/build-isos.yml'
  workflow_dispatch:
    inputs:
      variant:
        description: Variant(s) to build
        type: choice
        options: [both, arch, artix]
        default: both
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

concurrency:
  group: build-isos-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      variants: ${{ steps.matrix.outputs.variants }}
    steps:
      - name: Choose variants
        id: matrix
        env:
          EVENT: ${{ github.event_name }}
          INPUT: ${{ inputs.variant }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == workflow_dispatch && -n "$INPUT" && "$INPUT" != both ]]; then
            printf 'variants=["%s"]\n' "$INPUT" >> "$GITHUB_OUTPUT"
          else
            echo 'variants=["arch","artix"]' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: ${{ matrix.variant }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.plan.outputs.variants) }}
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          set -euo pipefail
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost
          sudo docker system prune -af
          df -h /

      - name: Prepare loop devices
        run: |
          set -euo pipefail
          sudo modprobe loop || true
          if ! sudo losetup -f >/dev/null 2>&1; then
            for i in $(seq 8 15); do
              [[ -e "/dev/loop$i" ]] || sudo mknod "/dev/loop$i" b 7 "$i"
            done
          fi
          sudo losetup -f

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Cache key
        id: cache_key
        run: echo "month=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Cache vendored Brave package
        uses: actions/cache@v4
        with:
          path: axyl-build/pkgs
          key: brave-bin-${{ steps.cache_key.outputs.month }}-${{ hashFiles('docker/Dockerfile.brave') }}

      - name: Resolve ISO version
        id: version
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build ${{ matrix.variant }} ISO
        env:
          AXYL_VERSION: ${{ steps.version.outputs.value }}
        run: ./build.sh "${{ matrix.variant }}"

      - name: Fix output ownership
        run: sudo chown -R "$(id -u):$(id -g)" axyl-out

      - name: Verify ISO
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          dir="axyl-out/$VARIANT"
          manifest="$dir/axyl-$VARIANT-manifest.txt"
          [[ -f "$manifest" ]]
          iso="$(sed -n 's/^iso=//p' "$manifest")"
          [[ -n "$iso" ]]
          [[ -f "$dir/$iso" ]]
          ( cd "$dir" && sha256sum -c "$iso.sha256" )

          if ! command -v xorriso >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq xorriso
          fi

          boot="$(xorriso -indev "$dir/$iso" -report_el_torito plain 2>/dev/null)"
          printf '%s\n' "$boot"
          printf '%s\n' "$boot" | grep -qi 'El Torito'
          xorriso -indev "$dir/$iso" -ls /arch/boot/x86_64 2>/dev/null \
            | grep -q 'initramfs-linux.img'
          xorriso -indev "$dir/$iso" -ls /EFI/BOOT 2>/dev/null \
            | grep -qi 'BOOTX64.EFI'

      - name: Split ISO for upload
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          dir="axyl-out/$VARIANT"
          iso="$(sed -n 's/^iso=//p' "$dir/axyl-$VARIANT-manifest.txt")"
          rm -f "$dir"/*.part-*
          split -b 1900M -d -a 3 "$dir/$iso" "$dir/$iso.part-"
          cp tools/reassemble-iso.sh "$dir/"
          ls -lh "$dir"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: axyl-iso-${{ matrix.variant }}
          path: |
            axyl-out/${{ matrix.variant }}/*.part-*
            axyl-out/${{ matrix.variant }}/*.sha256
            axyl-out/${{ matrix.variant }}/*manifest*
            axyl-out/${{ matrix.variant }}/reassemble-iso.sh
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download ISO artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Reassemble and verify ISOs
        run: |
          set -euo pipefail
          for manifest in dist/axyl-*-manifest.txt; do
            iso="$(sed -n 's/^iso=//p' "$manifest")"
            ( cd dist && cat "$iso".part-* > "$iso" && sha256sum -c "$iso.sha256" )
          done

      - name: Write release notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          notes="$RUNNER_TEMP/release-notes.md"
          {
            echo "Axyl Linux ${version}"
            echo
            echo "| Variant | ISO | Size | SHA-256 |"
            echo "| --- | --- | --- | --- |"
            for manifest in dist/axyl-*-manifest.txt; do
              variant="$(sed -n 's/^variant=//p' "$manifest")"
              iso="$(sed -n 's/^iso=//p' "$manifest")"
              sha="$(sed -n 's/^sha256=//p' "$manifest")"
              size="$(du -h "dist/$iso" | cut -f1)"
              echo "| ${variant} | \`${iso}\` | ${size} | \`${sha}\` |"
            done
            echo
            echo "Each ISO is split into parts below the 2 GiB release-asset limit."
            echo "Reassemble and verify with the bundled script:"
            echo
            echo '```sh'
            echo './reassemble-iso.sh axyl-arch-'"${version}"'-x86_64.iso'
            echo './reassemble-iso.sh axyl-artix-'"${version}"'-x86_64.iso'
            echo '```'
            echo
            echo "Live credentials: user \`axyl\` / \`axyl\`, root \`toor\`."
          } > "$notes"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          files=(dist/*.part-* dist/*.sha256 dist/*manifest.txt dist/reassemble-iso.sh)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --title "Axyl Linux ${GITHUB_REF_NAME#v}" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
