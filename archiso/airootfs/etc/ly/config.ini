[config]
tty = 2
animation = doom
lang = en
numlock = true
hide_borders = false
vi_mode = false
waylandsessions = /usr/share/wayland-sessions
xsessions = /usr/share/xsessions
x_cmd = /usr/bin/Xorg
shutdown_cmd = /sbin/shutdown -h now
restart_cmd = /sbin/shutdown -r now
suspend_cmd = /bin/systemctl suspend
term_reset_cmd = /usr/bin/reset
xauth_cmd = /usr/bin/xauth
autologin_user = axyl
autologin_session = bspwm
