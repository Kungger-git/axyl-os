# Font
font_family      JetBrains Mono
bold_font        JetBrains Mono Bold
italic_font      JetBrains Mono Italic
bold_italic_font JetBrains Mono Bold Italic
font_size        12.0

# Window
window_padding_width    8
background_opacity      0.95
remember_window_size    no
initial_window_width    120c
initial_window_height   32c
hide_window_decorations no
active_border_color     #d97757
inactive_border_color   #45475a
bell_border_color       #ff5555
window_border_width     1px

# Cursor
cursor             #d97757
cursor_text_color  #1a1a2e
cursor_shape       block
cursor_blink_interval 0

# URL
url_color   #d97757
url_style   curly
open_url_with xdg-open

# Bell
enable_audio_bell    no
visual_bell_duration 0

# Tab bar
tab_bar_style           powerline
tab_powerline_style     slanted
active_tab_background   #d97757
active_tab_foreground   #1a1a2e
inactive_tab_background #16213e
inactive_tab_foreground #e6e1d8

# Claude color scheme
foreground           #e6e1d8
background           #1a1a2e
selection_foreground #1a1a2e
selection_background #d97757

# Black
color0  #1a1a2e
color8  #45475a

# Red
color1  #ff5555
color9  #ff6e6e

# Green
color2  #50fa7b
color10 #69ff94

# Yellow
color3  #f1fa8c
color11 #ffffa5

# Blue
color4  #6272a4
color12 #8be9fd

# Magenta
color5  #bd93f9
color13 #d6acff

# Cyan
color6  #8be9fd
color14 #a4ffff

# White
color7  #e6e1d8
color15 #ffffff
