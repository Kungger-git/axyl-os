# /etc/systemd/zram-generator.conf
# Compressed RAM swap for low-memory machines: half of RAM, capped at 4 GiB.
# zstd compresses better than lz4 at a modest CPU cost; with zram there is no
# disk I/O, so this is still far faster than any swap file.
[zram0]
zram-size = min(ram / 2, 4096)
compression-algorithm = zstd
swap-priority = 100
fs-type = swap
