# /etc/tlp.d/50-axyl.conf
# Hardware-neutral laptop power defaults. Anything ThinkPad-specific (charge
# thresholds) is left to udev/TLP defaults so the image works on other brands.
# schedutil follows the workload without the latency of powersave/ondemand.
CPU_SCALING_GOVERNOR_ON_AC=schedutil
CPU_SCALING_GOVERNOR_ON_BAT=schedutil
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=0

# Wi-Fi power saving only matters on battery.
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on

# Runtime power management for PCIe/USB devices.
RUNTIME_PM_ON_AC=on
RUNTIME_PM_ON_BAT=auto

# Audio codec power saving on battery.
SOUND_POWER_SAVE_ON_AC=0
SOUND_POWER_SAVE_ON_BAT=1
