[options]
HoldPkg           = pacman glibc
Architecture      = auto
Color
ILoveCandy
VerbosePkgLists
CheckSpace
ParallelDownloads = 1
SigLevel          = Required DatabaseOptional
LocalFileSigLevel = Optional

# SteamOS repos. SigLevel=Never applies to the Docker build host only -- it has
# no Valve keyring and cannot verify jupiter/holo signatures.
[jupiter-3.9]
Server = https://steamdeck-packages.steamos.cloud/archlinux-mirror/$repo/os/$arch
SigLevel = Never

[holo-3.9]
Server = https://steamdeck-packages.steamos.cloud/archlinux-mirror/$repo/os/$arch
SigLevel = Never

[core-3.9]
Server = https://steamdeck-packages.steamos.cloud/archlinux-mirror/$repo/os/$arch
SigLevel = Never

[extra-3.9]
Server = https://steamdeck-packages.steamos.cloud/archlinux-mirror/$repo/os/$arch
SigLevel = Never

[multilib-3.9]
Server = https://steamdeck-packages.steamos.cloud/archlinux-mirror/$repo/os/$arch
SigLevel = Never
