DEFAULT axyl
PROMPT   0
TIMEOUT  30

MENU TITLE Axyl Linux
MENU COLOR border       30;44   #40ffffff #a0000000 std
MENU COLOR sel          7;37;40 #e0ffffff #20ffffff all
MENU COLOR title        1;36;44 #d97757   #00000000 std
MENU COLOR tabmsg       31;40   #80ffffff #00000000 std
MENU COLOR cmdmark      1;36;40 #c000d88a #00000000 std
MENU COLOR cmdline      37;40   #c0ffffff #00000000 std

LABEL axyl
  MENU LABEL Axyl Linux
  LINUX  /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
  INITRD /%INSTALL_DIR%/boot/intel-ucode.img,/%INSTALL_DIR%/boot/amd-ucode.img,/%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
  APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% cow_spacesize=1G zswap.enabled=0

LABEL axyl-nomodeset
  MENU LABEL Axyl Linux (nomodeset)
  LINUX  /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
  INITRD /%INSTALL_DIR%/boot/intel-ucode.img,/%INSTALL_DIR%/boot/amd-ucode.img,/%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
  APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% nomodeset cow_spacesize=1G zswap.enabled=0

LABEL reboot
  MENU LABEL Reboot
  COM32 /syslinux/reboot.c32

LABEL poweroff
  MENU LABEL Power Off
  COM32 /syslinux/poweroff.c32
