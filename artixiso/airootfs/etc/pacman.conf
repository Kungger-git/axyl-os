[options]
HoldPkg           = pacman glibc
Architecture      = auto
Color
ILoveCandy
VerbosePkgLists
CheckSpace
ParallelDownloads = 1
SigLevel          = Required DatabaseOptional
LocalFileSigLevel = Optional

[system]
Include = /etc/pacman.d/mirrorlist

[world]
Include = /etc/pacman.d/mirrorlist

[galaxy]
Include = /etc/pacman.d/mirrorlist

# Arch [extra] — provides packages absent from Artix repos (e.g. arch-install-scripts)
[extra]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch
SigLevel = Never
