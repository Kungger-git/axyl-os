insmod part_gpt
insmod part_msdos
set timeout=15
set default=0

if [ "${grub_platform}" == "efi" ]; then
    insmod all_video
    if loadfont unicode; then
        set gfxmode=auto
        set gfxpayload=keep
        terminal_output gfxterm
    fi
fi

menuentry "Axyl Linux (x86_64, UEFI)" {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% cow_spacesize=1G
    initrd /%INSTALL_DIR%/boot/intel-ucode.img /%INSTALL_DIR%/boot/amd-ucode.img /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
}

menuentry "Axyl Linux - nomodeset (troubleshooting)" {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% cow_spacesize=1G nomodeset
    initrd /%INSTALL_DIR%/boot/intel-ucode.img /%INSTALL_DIR%/boot/amd-ucode.img /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
}

menuentry "Reboot" {
    reboot
}

menuentry "Shutdown" {
    halt
}
