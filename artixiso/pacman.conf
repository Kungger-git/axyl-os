[options]
HoldPkg           = pacman glibc
Architecture      = auto
Color
ILoveCandy
VerbosePkgLists
CheckSpace
ParallelDownloads = 1
SigLevel          = Required DatabaseOptional
LocalFileSigLevel = Optional

# Artix repos — use the mirrorlist written into the Docker image by Dockerfile.artix.
# This gives pacman multiple mirrors to fall back on if any one is slow or down.
[system]
Include = /etc/pacman.d/mirrorlist

[world]
Include = /etc/pacman.d/mirrorlist

[galaxy]
Include = /etc/pacman.d/mirrorlist

# Arch [extra] — mkinitcpio-archiso and arch-install-scripts are not in Artix repos.
# SigLevel=Never: build environment only; Artix packages above are still verified.
[extra]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch
SigLevel = Never
