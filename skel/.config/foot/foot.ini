# ~/.config/foot/foot.ini
# Colours live in colors.ini, generated by ~/.config/theme/render.py.

include=~/.config/foot/colors.ini

[main]
font=JetBrainsMono Nerd Font:size=10.5
pad=6x6
dpi-aware=no

[scrollback]
lines=5000

[cursor]
style=block
blink=yes
blink-rate=500

[mouse]
hide-when-typing=yes

[csd]
preferred=server
