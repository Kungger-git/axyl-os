
# GENERATED by ~/.config/theme/render.py -- do not edit by hand.
# Source of truth: ~/.config/theme/palette.json

general {
    hide_cursor        = true
    ignore_empty_input = true
}

background {
    monitor       = 
    path          = screenshot
    blur_passes   = 3
    blur_size     = 6
    noise         = 0.0
    contrast      = 1.0
    brightness    = 0.55
    vibrancy      = 0.2
    color         = rgba(0a0a0aff)
}

input-field {
    monitor             = 
    size                = 320, 52
    outline_thickness   = 2
    dots_size           = 0.22
    dots_spacing        = 0.25
    dots_center         = true
    rounding            = 10
    outer_color         = rgba(fab283ff)
    inner_color         = rgba(0a0a0aff)
    font_color          = rgba(eeeeeeff)
    check_color         = rgba(f8c17bff)
    fail_color          = rgba(e06c75ff)
    capslock_color      = rgba(f5a742ff)
    placeholder_text    = <span foreground="#808080">Password&hellip;</span>
    fail_text           = <span foreground="#e06c75">$FAIL ($ATTEMPTS)</span>
    fade_on_empty       = false
}

label {
    monitor     = 
    text        = cmd[update:1000] echo "$(date '+%H:%M')"
    color       = rgba(eeeeeeff)
    font_size   = 72
    font_family = JetBrainsMono Nerd Font
    position    = 0, 110
    halign      = center
    valign      = center
}

label {
    monitor     = 
    text        = cmd[update:60000] echo "$(date '+%A, %d %B')"
    color       = rgba(808080ff)
    font_size   = 16
    font_family = JetBrainsMono Nerd Font
    position    = 0, 55
    halign      = center
    valign      = center
}
