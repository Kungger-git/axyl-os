# Backend: xrender works on all hardware including QEMU.
# For systems with a capable GPU, switch to "glx" and change blur-method to
# "dual_kawase" with blur-strength = 4 for higher quality compositing.
backend = "xrender";
vsync = true;

# Fading
fading       = true;
fade-delta   = 4;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-exclude = [];

# Shadows
shadow        = true;
shadow-radius = 12;
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-opacity  = 0.35;
shadow-exclude = [
    "name = 'Notification'",
    "class_g = 'Dunst'",
    "class_g = 'polybar'",
    "class_g = 'slop'",
    "class_g = 'flameshot'",
    "_GTK_FRAME_EXTENTS@:c"
];

# Transparency
inactive-opacity = 1.0;
active-opacity   = 1.0;
frame-opacity    = 1.0;
opacity-rule = [
    "90:class_g = 'kitty' && focused",
    "85:class_g = 'kitty' && !focused"
];

# Blur (xrender-compatible method)
blur-method = "box";
blur-size    = 6;
blur-background = false;
blur-background-exclude = [
    "class_g = 'slop'",
    "class_g = 'flameshot'"
];

corner-radius = 0;

mark-wmwin-focused     = true;
mark-ovredir-focused   = true;
detect-rounded-corners = true;
detect-client-opacity  = true;
detect-transient       = true;
use-damage             = true;
log-level              = "warn";
