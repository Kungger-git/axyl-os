[colors]
background       = #1a1a2e
background-alt   = #16213e
foreground       = #e6e1d8
foreground-muted = #6e7290
accent           = #d97757
accent-alt       = #e8927c
red              = #ff5555
green            = #50fa7b

[bar/axyl]
width            = 100%
height           = 28
radius           = 0
fixed-center     = true
background       = ${colors.background}
foreground       = ${colors.foreground}
line-size        = 2
border-size      = 0
padding-left     = 2
padding-right    = 2
module-margin-left  = 1
module-margin-right = 1
font-0 = JetBrains Mono:style=Regular:size=10;2
font-1 = Font Awesome 6 Free:style=Solid:size=10;2
font-2 = Font Awesome 6 Brands:style=Regular:size=10;2
modules-left   = bspwm xwindow
modules-center = playerctl date
modules-right  = cpu sep memory sep pulseaudio sep network-wireless network-wired
tray-position  = right
tray-padding   = 4
tray-maxsize   = 20
cursor-click   = pointer
cursor-scroll  = ns-resize
enable-ipc     = true
wm-restack     = bspwm

[module/sep]
type            = custom/text
content         = "|"
content-foreground = ${colors.foreground-muted}
content-padding = 1

[module/bspwm]
type = internal/bspwm
pin-workspaces = true
enable-click   = true
enable-scroll  = false
label-focused            = %index%
label-focused-background = ${colors.accent}
label-focused-foreground = ${colors.background}
label-focused-padding    = 2
label-focused-underline  = ${colors.accent}
label-occupied            = %index%
label-occupied-foreground = ${colors.foreground}
label-occupied-padding    = 2
label-urgent            = %index%!
label-urgent-background = ${colors.red}
label-urgent-foreground = ${colors.background}
label-urgent-padding    = 2
label-empty            = %index%
label-empty-foreground = ${colors.foreground-muted}
label-empty-padding    = 2

[module/xwindow]
type             = internal/xwindow
label            = %title:0:50:...%
label-foreground = ${colors.foreground-muted}
label-padding    = 2

[module/cpu]
type             = internal/cpu
interval         = 2
format-prefix    = " "
format-prefix-foreground = ${colors.accent}
format-underline = ${colors.accent}
label            = %percentage:2%%

[module/memory]
type             = internal/memory
interval         = 2
format-prefix    = " "
format-prefix-foreground = ${colors.accent}
format-underline = ${colors.accent}
label            = %percentage_used:2%%

[module/pulseaudio]
type                    = internal/pulseaudio
format-volume           = <ramp-volume> <label-volume>
format-volume-underline = ${colors.accent}
label-volume            = %percentage%%
label-muted             =  muted
label-muted-foreground  = ${colors.foreground-muted}
ramp-volume-0           = 
ramp-volume-1           = 
ramp-volume-2           = 
ramp-volume-0-foreground = ${colors.accent}
ramp-volume-1-foreground = ${colors.accent}
ramp-volume-2-foreground = ${colors.accent}

[module/network-wireless]
type                       = internal/network
interface-type             = wireless
interval                   = 3
label-connected            =  %essid%
label-connected-foreground = ${colors.foreground}
label-connected-underline  = ${colors.accent}
label-disconnected            = 
label-disconnected-foreground = ${colors.foreground-muted}

[module/network-wired]
type                       = internal/network
interface-type             = wired
interval                   = 3
label-connected            =  %ifname%
label-connected-foreground = ${colors.foreground}
label-connected-underline  = ${colors.accent}
label-disconnected            = 
label-disconnected-foreground = ${colors.foreground-muted}

[module/date]
type                     = internal/date
interval                 = 1
date                     = %a %Y-%m-%d
time                     = %H:%M
format-prefix            = " "
format-prefix-foreground = ${colors.accent}
format-underline         = ${colors.accent}
label                    = %date%  %time%

[module/playerctl]
type          = custom/script
exec          = playerctl metadata --format ' {{ artist }} - {{ title }}' 2>/dev/null || true
exec-if       = playerctl status 2>/dev/null
interval      = 2
label         = %output:0:45:...%
label-foreground = ${colors.foreground-muted}
click-left    = playerctl play-pause
click-right   = playerctl next
click-middle  = playerctl previous