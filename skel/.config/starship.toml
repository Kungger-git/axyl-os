# GENERATED by ~/.config/theme/render.py -- do not edit by hand.
# Source of truth: ~/.config/theme/palette.json

format = '''$directory$git_branch$git_status$cmd_duration$character'''
add_newline = false
command_timeout = 1000

[directory]
style = "bold #fab283"
truncation_length = 3
truncate_to_repo = true
format = "[$path]($style)[$read_only]($read_only_style) "
read_only_style = "#e06c75"

[git_branch]
style = "#9d7cd8"
symbol = " "
format = "[$symbol$branch]($style) "

[git_status]
style = "#e06c75"
format = "[$all_status$ahead_behind]($style) "

[cmd_duration]
min_time = 500
style = "#808080"
format = "took [$duration]($style) "

[character]
success_symbol = "[\u276f](bold #7fd88f)"
error_symbol = "[\u276f](bold #e06c75)"
vimcmd_symbol = "[\u276e](bold #f8c17b)"

[nodejs]
style = "#7fd88f"
symbol = " "
format = "[$symbol($version )]($style)"

[python]
style = "#f8c17b"
symbol = " "
format = "[$symbol($version )]($style)"
