<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="740" viewBox="0 0 1000 740" font-family="Inter, 'Segoe UI', sans-serif">
  <rect width="1000" height="740" fill="#0a0a0a"/>
  <text x="40" y="34" fill="#eeeeee" font-size="22" font-weight="700">The Axyl Deck app</text>

  <!-- window -->
  <rect x="40" y="52" width="920" height="660" rx="14" fill="#141414" stroke="#2a2a2a" stroke-width="2"/>
  <rect x="40" y="52" width="920" height="56" rx="14" fill="#1e1e1e"/>
  <rect x="40" y="94" width="920" height="14" fill="#1e1e1e"/>
  <text x="64" y="88" fill="#eeeeee" font-size="17" font-weight="700">Axyl Deck</text>
  <text x="176" y="88" fill="#808080" font-size="13">SteamOS + Hyprland</text>
  <circle cx="932" cy="80" r="9" fill="#e06c75"/>

  <!-- status -->
  <text x="70" y="140" fill="#fab283" font-size="20" font-weight="700">Axyl Hyprland</text>
  <text x="70" y="164" fill="#808080" font-size="13">Hyprland is running.</text>

  <!-- primary -->
  <rect x="70" y="184" width="860" height="92" rx="12" fill="#fab283"/>
  <text x="500" y="240" fill="#0a0a0a" font-size="22" font-weight="700" text-anchor="middle">Return to Steam Game Mode</text>

  <!-- buttons -->
  <g>
    <rect x="70" y="310" width="420" height="62" rx="10" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="280" y="348" fill="#eeeeee" font-size="17" text-anchor="middle">Return to KDE Desktop</text>
    <rect x="510" y="310" width="420" height="62" rx="10" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="720" y="348" fill="#eeeeee" font-size="17" text-anchor="middle">Steam Big Picture</text>

    <rect x="70" y="388" width="420" height="62" rx="10" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="280" y="426" fill="#eeeeee" font-size="17" text-anchor="middle">Terminal</text>
    <rect x="510" y="388" width="420" height="62" rx="10" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="720" y="426" fill="#eeeeee" font-size="17" text-anchor="middle">On-Screen Keyboard</text>

    <rect x="70" y="466" width="420" height="62" rx="10" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="280" y="504" fill="#eeeeee" font-size="17" text-anchor="middle">Deck Controls</text>
    <rect x="510" y="466" width="420" height="62" rx="10" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="720" y="504" fill="#eeeeee" font-size="17" text-anchor="middle">Files</text>

    <rect x="70" y="544" width="420" height="62" rx="10" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="280" y="582" fill="#eeeeee" font-size="17" text-anchor="middle">Setup / Repair</text>
    <rect x="510" y="544" width="420" height="62" rx="10" fill="#1e1e1e" stroke="#3a3a3a" stroke-width="1.5"/>
    <text x="720" y="582" fill="#eeeeee" font-size="17" text-anchor="middle">Logs</text>
  </g>

  <text x="500" y="650" fill="#808080" font-size="12" text-anchor="middle">Switching closes Steam and open apps. A reboot always returns to Steam Game Mode.</text>
  <text x="500" y="676" fill="#5c9cf5" font-size="12" text-anchor="middle">In Game Mode the top button reads: Switch to Axyl Hyprland</text>

  <!-- badges -->
  <g fill="#fab283">
    <circle cx="916" cy="196" r="13"/>
    <circle cx="472" cy="322" r="13"/><circle cx="912" cy="322" r="13"/>
    <circle cx="472" cy="400" r="13"/><circle cx="912" cy="400" r="13"/>
    <circle cx="472" cy="478" r="13"/><circle cx="912" cy="478" r="13"/>
    <circle cx="472" cy="556" r="13"/><circle cx="912" cy="556" r="13"/>
  </g>
  <g fill="#0a0a0a" font-size="14" font-weight="700" text-anchor="middle">
    <text x="916" y="201">1</text>
    <text x="472" y="327">2</text><text x="912" y="327">3</text>
    <text x="472" y="405">4</text><text x="912" y="405">5</text>
    <text x="472" y="483">6</text><text x="912" y="483">7</text>
    <text x="472" y="561">8</text><text x="912" y="561">9</text>
  </g>
</svg>
