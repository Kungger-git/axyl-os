# ~/.config/foot/foot.ini -- Steam Deck profile.
# Colours live in colors.ini, generated by ~/.config/theme/render.py.

include=~/.config/foot/colors.ini

[main]
font=JetBrains Mono:size=12
pad=10x10
dpi-aware=no

[scrollback]
lines=5000

[cursor]
style=block
blink=yes
blink-rate=500

[mouse]
hide-when-typing=yes

[csd]
preferred=server
